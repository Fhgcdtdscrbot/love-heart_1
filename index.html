<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Я люблю тебя ❤️</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

html, body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #000;
    font-family: Arial, sans-serif;
}

canvas {
    display: block;
    width: 100%;
    height: 100%;
}

#tapButton {
    position: fixed;
    left: 50%;
    top: 88%;
    transform: translate(-50%, -50%);
    padding: 15px 45px;
    border: 2px solid #ff1744;
    border-radius: 40px;
    background: #ff003c;
    color: white;
    font-size: 25px;
    font-weight: bold;
    box-shadow: 0 0 20px #ff1744;
    cursor: pointer;
    display: none;
    z-index: 10;
}

#tapButton:active {
    transform: translate(-50%, -50%) scale(0.92);
}
</style>
</head>

<body>

<canvas id="canvas"></canvas>
<button id="tapButton">Тык ❤️</button>

<script>
const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");
const button = document.getElementById("tapButton");

let w, h, scale;
let points = [];

const N = 500;
let filling = false;
let fillProgress = 0;
let pulseStart = 0;
let animationStarted = false;

const message = "Я люблю тебя❤️";

function resize() {
    const dpr = window.devicePixelRatio || 1;

    w = window.innerWidth;
    h = window.innerHeight;

    canvas.width = w * dpr;
    canvas.height = h * dpr;

    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

    scale = Math.min(w * 0.82 / 32, h * 0.48 / 30);

    createHeart();
}

function createHeart() {
    points = [];

    for (let i = 0; i <= N; i++) {
        const t = Math.PI + 2 * Math.PI * i / N;

        const x = 16 * Math.sin(t) ** 3;

        const y =
            13 * Math.cos(t)
            - 5 * Math.cos(2 * t)
            - 2 * Math.cos(3 * t)
            - Math.cos(4 * t);

        points.push({
            x: w / 2 + x * scale,
            y: h / 2 - y * scale
        });
    }
}

function clear() {
    ctx.fillStyle = "#000";
    ctx.fillRect(0, 0, w, h);
}

function heartPath() {
    ctx.beginPath();

    points.forEach((p, i) => {
        if (i === 0) ctx.moveTo(p.x, p.y);
        else ctx.lineTo(p.x, p.y);
    });

    ctx.closePath();
}

function drawOutline(step) {
    clear();

    ctx.beginPath();

    for (let i = 0; i <= step; i++) {
        const p = points[i];

        if (i === 0) ctx.moveTo(p.x, p.y);
        else ctx.lineTo(p.x, p.y);
    }

    ctx.strokeStyle = "#ff1744";
    ctx.lineWidth = 5;
    ctx.lineCap = "round";
    ctx.lineJoin = "round";
    ctx.shadowColor = "#ff1744";
    ctx.shadowBlur = 25;
    ctx.stroke();

    if (step < N) {
        setTimeout(() => {
            drawOutline(Math.min(step + 5, N));
        }, 5);
    } else {
        button.style.display = "block";
    }
}

function fillHeart() {
    if (animationStarted) return;

    animationStarted = true;
    filling = true;

    button.style.display = "none";
    fillProgress = 0;

    requestAnimationFrame(animateFill);
}

function animateFill() {
    clear();

    heartPath();

    ctx.save();
    heartPath();
    ctx.clip();

    const top = h / 2 - 17 * scale;
    const bottom = h / 2 + 17 * scale;
    const level = bottom - (bottom - top) * fillProgress;

    const wave = Math.sin(performance.now() / 180) * 5;

    ctx.beginPath();
    ctx.moveTo(0, level);

    for (let x = 0; x <= w; x += 5) {
        const y = level +
            Math.sin(x / 25 + performance.now() / 180) * wave;

        ctx.lineTo(x, y);
    }

    ctx.lineTo(w, h);
    ctx.lineTo(0, h);
    ctx.closePath();

    const gradient = ctx.createLinearGradient(0, level, 0, bottom);
    gradient.addColorStop(0, "#ff416c");
    gradient.addColorStop(1, "#ff003c");

    ctx.fillStyle = gradient;
    ctx.shadowColor = "#ff1744";
    ctx.shadowBlur = 25;
    ctx.fill();

    ctx.restore();

    heartPath();
    ctx.strokeStyle = "#ff1744";
    ctx.lineWidth = 5;
    ctx.shadowColor = "#ff1744";
    ctx.shadowBlur = 25;
    ctx.stroke();

    if (fillProgress < 1) {
        fillProgress = Math.min(fillProgress + 0.008, 1);
        requestAnimationFrame(animateFill);
    } else {
        pulseStart = performance.now();
        requestAnimationFrame(pulse);
    }
}

function pulse(now) {
    clear();

    const t = (now - pulseStart) / 1000;
    const size = 1 + Math.sin(t * 3) * 0.045;

    ctx.save();
    ctx.translate(w / 2, h / 2);
    ctx.scale(size, size);
    ctx.translate(-w / 2, -h / 2);

    heartPath();

    ctx.fillStyle = "#ff003c";
    ctx.shadowColor = "#ff1744";
    ctx.shadowBlur = 28;
    ctx.fill();

    ctx.strokeStyle = "#ff1744";
    ctx.lineWidth = 5;
    ctx.shadowBlur = 22;
    ctx.stroke();

    ctx.restore();

    const fontSize = Math.min(scale * 3.2, 42);

    ctx.textAlign = "center";
    ctx.textBaseline = "middle";
    ctx.font = `italic bold ${fontSize}px cursive`;

    const colors = [
        "#0033ff",
        "#0055ff",
        "#0088ff",
        "#00ccff"
    ];

    colors.forEach(color => {
        ctx.shadowBlur = 20;
        ctx.shadowColor = color;
        ctx.fillStyle = color;
        ctx.fillText(message, w / 2, h / 2);
    });

    ctx.shadowBlur = 14;
    ctx.shadowColor = "#00ccff";
    ctx.fillStyle = "#fff";
    ctx.fillText(message, w / 2, h / 2);

    ctx.shadowBlur = 0;

    requestAnimationFrame(pulse);
}

button.addEventListener("click", fillHeart);

window.addEventListener("resize", () => {
    resize();

    if (!filling) {
        drawStaticOutline();
    }
});

function drawStaticOutline() {
    clear();
    heartPath();

    ctx.strokeStyle = "#ff1744";
    ctx.lineWidth = 5;
    ctx.shadowColor = "#ff1744";
    ctx.shadowBlur = 25;
    ctx.stroke();
}

resize();
drawOutline(0);

</script>
</body>
    </html>
