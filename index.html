<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Люблю тебя ❤️</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

html, body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #000;
}

canvas {
    display: block;
    width: 100%;
    height: 100%;
}
</style>
</head>

<body>
<canvas id="canvas"></canvas>

<script>
const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");

let w, h, scale;
let points = [];

const N = 500;
const message = "Люблю тебя ❤️";

let textIndex = 0;
let phase = "outline";
let progress = 0;
let pulseStart = 0;

function resize() {
    const dpr = window.devicePixelRatio || 1;
    w = window.innerWidth;
    h = window.innerHeight;

    canvas.width = w * dpr;
    canvas.height = h * dpr;

    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

    scale = Math.min(w * 0.82 / 32, h * 0.48 / 30);

    createHeart();
}

function createHeart() {
    points = [];

    for (let i = 0; i <= N; i++) {
        const t = Math.PI + 2 * Math.PI * i / N;

        const x = 16 * Math.sin(t) ** 3;
        const y =
            13 * Math.cos(t)
            - 5 * Math.cos(2 * t)
            - 2 * Math.cos(3 * t)
            - Math.cos(4 * t);

        points.push({
            x: w / 2 + x * scale,
            y: h / 2 - y * scale
        });
    }
}

function clear() {
    ctx.fillStyle = "#000";
    ctx.fillRect(0, 0, w, h);
}

function drawHeart(fill = true, pulse = 1) {
    ctx.save();
    ctx.translate(w / 2, h / 2);
    ctx.scale(pulse, pulse);
    ctx.translate(-w / 2, -h / 2);

    ctx.beginPath();

    points.forEach((p, i) => {
        if (i === 0) ctx.moveTo(p.x, p.y);
        else ctx.lineTo(p.x, p.y);
    });

    ctx.closePath();

    if (fill) {
        ctx.fillStyle = "#ff003c";
        ctx.shadowColor = "#ff1744";
        ctx.shadowBlur = 28;
        ctx.fill();
    }

    ctx.strokeStyle = "#ff1744";
    ctx.lineWidth = 5;
    ctx.lineJoin = "round";
    ctx.shadowColor = "#ff1744";
    ctx.shadowBlur = 22;
    ctx.stroke();

    ctx.restore();
}

function drawOutline(step = 0) {
    clear();

    ctx.beginPath();

    for (let i = 0; i <= step; i++) {
        const p = points[i];

        if (i === 0) ctx.moveTo(p.x, p.y);
        else ctx.lineTo(p.x, p.y);
    }

    ctx.strokeStyle = "#ff1744";
    ctx.lineWidth = 5;
    ctx.lineCap = "round";
    ctx.shadowColor = "#ff1744";
    ctx.shadowBlur = 22;
    ctx.stroke();

    if (step < N) {
        setTimeout(() => {
            drawOutline(Math.min(step + 5, N));
        }, 5);
    } else {
        setTimeout(() => fillHeart(0), 300);
    }
}

function fillHeart(value) {
    clear();

    drawHeart(true);

    const top = h / 2 - 17 * scale;
    const bottom = h / 2 + 17 * scale;
    const reveal = bottom - (bottom - top) * value;

    ctx.fillStyle = "#000";
    ctx.fillRect(0, 0, w, reveal);

    drawHeart(false);

    if (value < 1) {
        setTimeout(() => {
            fillHeart(Math.min(value + 0.025, 1));
        }, 15);
    } else {
        setTimeout(() => showText(0), 400);
    }
}

function showText(index) {
    clear();
    drawHeart(true);

    const visibleText = message.slice(0, index);
    const fontSize = Math.min(scale * 3.2, 48);

    ctx.textAlign = "center";
    ctx.textBaseline = "middle";
    ctx.font = `italic bold ${fontSize}px cursive`;

    const colors = [
        "#0033ff",
        "#0055ff",
        "#0088ff",
        "#00ccff"
    ];

    colors.forEach(color => {
        ctx.shadowBlur = 20;
        ctx.shadowColor = color;
        ctx.fillStyle = color;
        ctx.fillText(visibleText, w / 2, h / 2);
    });

    ctx.shadowBlur = 14;
    ctx.shadowColor = "#00ccff";
    ctx.fillStyle = "#fff";
    ctx.fillText(visibleText, w / 2, h / 2);

    ctx.shadowBlur = 0;

    if (index < message.length) {
        setTimeout(() => showText(index + 1), 180);
    } else {
        pulseStart = performance.now();
        requestAnimationFrame(pulse);
    }
}

function pulse(now) {
    clear();

    const t = (now - pulseStart) / 1000;
    const size = 1 + Math.sin(t * 3) * 0.045;

    drawHeart(true, size);

    const fontSize = Math.min(scale * 3.2, 48);

    ctx.textAlign = "center";
    ctx.textBaseline = "middle";
    ctx.font = `italic bold ${fontSize}px cursive`;

    ctx.shadowBlur = 20;
    ctx.shadowColor = "#00ccff";
    ctx.fillStyle = "#fff";
    ctx.fillText(message, w / 2, h / 2);

    requestAnimationFrame(pulse);
}

resize();
window.addEventListener("resize", resize);

setTimeout(() => {
    drawOutline();
}, 300);
</script>
</body>
</html>
