<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Для тебя ❤️</title>
<style>
body {
 margin:0;
 min-height:100vh;
 display:flex;
 align-items:center;
 justify-content:center;
 text-align:center;
 color:white;
 font-family:Arial;
 background:radial-gradient(circle,#a51d60,#180817);
 overflow:hidden;
}
.heart {
 font-size:130px;
 animation:pulse 1s infinite;
 filter:drop-shadow(0 0 30px #ff398b);
}
@keyframes pulse {
 50% {transform:scale(1.2)}
}
button {
 padding:16px 35px;
 border:0;
 border-radius:30px;
 background:#f02d79;
 color:white;
 font-size:20px;
}
.particle {
 position:fixed;
 bottom:-30px;
 animation:fly 5s linear forwards;
 pointer-events:none;
}
@keyframes fly {
 to {transform:translateY(-110vh);opacity:0}
}
</style>
</head>
<body>
<div>
<h2>У меня есть кое-что для тебя...</h2>
<div class="heart">❤️</div>
<p id="message">Нажми на кнопку</p>
<button onclick="showLove()">НАЖМИ ❤️</button>
</div>
<script>
function showLove(){
 document.getElementById("message").textContent="Я тебя люблю ❤️";
 for(let i=0;i<40;i++){
  let e=document.createElement("div");
  e.className="particle";
  e.textContent=Math.random()>.5?"❤️":"✨";
  e.style.left=Math.random()*100+"vw";
  e.style.fontSize="25px";
  e.style.animationDuration=(3+Math.random()*4)+"s";
  document.body.appendChild(e);
  setTimeout(()=>e.remove(),7000);
 }
}
</script>
</body>
</html>
